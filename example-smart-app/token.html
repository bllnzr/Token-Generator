<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Token Viewer</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
      background: #f5f5f5;
    }
    .box {
      max-width: 900px;
      background: #fff;
      padding: 24px;
      border-radius: 10px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    }
    pre {
      white-space: pre-wrap;
      word-break: break-word;
      background: #f0f0f0;
      padding: 16px;
      border-radius: 8px;
      min-height: 80px;
    }
    button {
      margin-top: 12px;
      padding: 10px 14px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>Access Token</h1>
    <pre id="token">No token found</pre>
    <button id="copyBtn">Copy token</button>
  </div>

  <script>
    function getTokenFromHash() {
      var hash = window.location.hash || "";
      var match = hash.match(/token=([^&]+)/);
      return match ? decodeURIComponent(match[1]) : null;
    }

    var token = getTokenFromHash();
    if (token) {
      document.getElementById("token").textContent = token;

      // optional: remove token from address bar after reading it
      history.replaceState(null, "", window.location.pathname);
    }

    document.getElementById("copyBtn").addEventListener("click", async function () {
      try {
        await navigator.clipboard.writeText(document.getElementById("token").textContent);
        alert("Token copied");
      } catch (e) {
        alert("Copy failed");
      }
    });
  </script>
</body>
</html>
